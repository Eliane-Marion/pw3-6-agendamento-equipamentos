spring.application.name=reserva-armarios
server.port=8080

# ---------- Banco H2 em memória ----------
spring.datasource.url=jdbc:h2:mem:armariosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:armariosdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA / Hibernate ----------
# cria a tabela reserva_armario automaticamente a partir da @Entity
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# executa o data.sql (dados de exemplo) depois que o Hibernate cria a tabela
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
